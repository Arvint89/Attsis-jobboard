## aider config for attsis-jobboard
## Loaded automatically when you run `aider` from this repo root.
## Docs: https://aider.chat/docs/config/aider_conf.html

## Main model — Groq's GPT-OSS 20B (fast, fits free-tier TPM with orientation files)
## Note: Llama 3.3 70B was deprecated by Groq. Larger option gpt-oss-120b hits 8k TPM
## ceiling on free tier when read-only orientation files load — bump only when you
## upgrade to Groq Dev tier.

model: groq/openai/gpt-oss-20b

## Weak model — same family, used for commit messages, summaries, small ops
weak-model: groq/openai/gpt-oss-20b

## Edit format — diff mode = tightest tokens + easiest to review
edit-format: diff

## Off: BT runs git himself and reviews every diff before committing (ADR-001 working agreement).
auto-commits: false
dirty-commits: false

## No auto-loaded read files: Groq free tier is 8k tokens/minute and a single request already
## carries ~2k of aider instructions + the files being edited. Add context per task with /read.

## Show diffs before applying — safer while you're learning aider
show-diffs: true

## Repo map off: /add the exact files a task needs instead (fits the 8k TPM limit).
## Groq free tier: 1,000 req/day shared with ai-empire, shorts, signal, etsy.
map-tokens: 0

## NOTE: files that must NEVER be edited (site/data/jobs.json, engine/fixtures.json)
## live in .aiderignore — that's aider's mechanism, not a config key.
