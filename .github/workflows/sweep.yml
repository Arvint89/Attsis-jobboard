name: job-sweep
# Runs the fetcher on a schedule, commits fresh data, and deploys the board to
# GitHub Pages. Zero Claude tokens: this is plain Python on GitHub's runners.
# Deploys from `production` only — main is the integration branch, promotions to
# production happen via PR (see docs/decisions/ADR-006-production-branch.md).
on:
  push:
    branches: [production]
    paths:                      # JB-41: docs/tools-only pushes don't trigger a 5-min live fetch
      - "engine/**"
      - "site/**"
      - ".github/workflows/sweep.yml"
  schedule:
    - cron: "39 12 * * 1-5"   # 08:39 America/Toronto (12:39 UTC), weekdays
  workflow_dispatch: {}         # manual "Run" button
concurrency:                    # JB-41: never run two sweeps at once; the newest wins
  group: job-sweep
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production         # cron/manual always build production, not the default branch
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r engine/requirements.txt
      - name: Fetch all ATS + build board
        run: cd engine && python build_board.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
