name: auto-tag

# JB-27: VERSION file is the source of truth for release tags. On every push
# to main this workflow reads VERSION and, if v<VERSION> doesn't already
# exist, creates and pushes an annotated tag on that commit. Idempotent --
# re-runs on the same VERSION are a silent no-op.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Tag from VERSION if new
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "no VERSION file at repo root; nothing to tag"
            exit 0
          fi
          v=$(tr -d '[:space:]' < VERSION)
          if [ -z "$v" ]; then
            echo "VERSION is empty; nothing to tag"
            exit 0
          fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION '$v' is not MAJOR.MINOR.BUGS; refusing to tag"
            exit 1
          fi
          tag="v${v}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists; nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "release ${tag} (auto-tagged from VERSION)"
          git push origin "${tag}"
          echo "tagged ${tag} on $(git rev-parse HEAD)"
