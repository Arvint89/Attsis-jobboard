name: probe-getro

# JB-59: on-demand Getro board discovery.
# Probes a curated list of Canadian accelerator / EDO / innovation-hub boards
# to find their network_id. Read-only -- prints results so a follow-up PR
# can add confirmed ids to engine/sources.json.
#
# Same sandbox-safe pattern as verify-dayforce / resolve-sweep / verify-promotions.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r engine/requirements.txt
      - name: Probe candidate Getro boards
        run: python tools/probe_getro_networks.py
